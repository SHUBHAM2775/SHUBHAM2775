name: Generate Den Den Mushi contribution graph

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 03:00 UTC — adjust as you like
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dendenmushi.svg
        run: node scripts/dendenmushi/generate.mjs SHUBHAM2775 dendenmushi.svg

      - name: Commit the updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dendenmushi.svg
          git diff --quiet --cached || git commit -m "Update Den Den Mushi contribution graph"
          git push
