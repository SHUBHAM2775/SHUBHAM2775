name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SHUBHAM2775
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # snk sets the total animation length as a fixed millisecond value
      # baked into the SVG. This halves every duration in the file so the
      # snake moves twice as fast. Change "/2" to "/3" for 3x speed, etc.
      - name: Speed up the animation
        run: |
          perl -i -pe 's/(\d+)ms/int($1\/2)."ms"/ge' dist/github-contribution-grid-snake.svg
          perl -i -pe 's/(\d+)ms/int($1\/2)."ms"/ge' dist/github-contribution-grid-snake-dark.svg

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
