<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a11cb"/>
      <stop offset="50%" stop-color="#2575fc"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2575fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2575fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="400" cy="150" rx="380" ry="220" fill="url(#glow)"/>

  <!-- monitor -->
  <rect x="270" y="70" width="260" height="160" rx="12" fill="#0d1117" stroke="#2575fc" stroke-width="2.5"/>
  <rect x="284" y="84" width="232" height="132" rx="6" fill="url(#screenGrad)"/>
  <rect x="368" y="230" width="64" height="16" rx="2" fill="#0d1117"/>
  <rect x="336" y="246" width="128" height="10" rx="5" fill="#0d1117"/>
  <ellipse cx="400" cy="150" rx="90" ry="50" fill="#ffffff" opacity="0.06"/>

  <!-- ===== FRONTEND particles (cyan) ===== -->
  <circle r="7" fill="#00c6ff" filter="url(#soft)">
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M400,150 C 340,60 260,10 150,-40" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#00c6ff" filter="url(#soft)">
    <animateMotion dur="5.2s" begin="0.6s" repeatCount="indefinite"
      path="M400,150 C 330,90 230,60 110,10" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#7fe4ff" filter="url(#soft)">
    <animateMotion dur="3.8s" begin="1.4s" repeatCount="indefinite"
      path="M400,150 C 350,80 290,40 220,-30" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="3.8s" begin="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== BACKEND particles (green) ===== -->
  <circle r="7" fill="#3ddc84" filter="url(#soft)">
    <animateMotion dur="4.8s" begin="0.3s" repeatCount="indefinite"
      path="M400,150 C 460,60 540,10 650,-40" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="4.8s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#3ddc84" filter="url(#soft)">
    <animateMotion dur="5.5s" begin="1s" repeatCount="indefinite"
      path="M400,150 C 470,90 570,60 690,10" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="5.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#8ef0b5" filter="url(#soft)">
    <animateMotion dur="4s" begin="1.8s" repeatCount="indefinite"
      path="M400,150 C 450,80 510,40 580,-30" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="4s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== DATABASE particles (violet) ===== -->
  <circle r="6" fill="#a855f7" filter="url(#soft)">
    <animateMotion dur="5s" begin="0.9s" repeatCount="indefinite"
      path="M400,150 C 340,220 260,270 150,320" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="5s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#c890fb" filter="url(#soft)">
    <animateMotion dur="4.3s" begin="2s" repeatCount="indefinite"
      path="M400,150 C 360,230 300,270 240,330" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="4.3s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== TOOLS particles (amber) ===== -->
  <circle r="6" fill="#ff9d3f" filter="url(#soft)">
    <animateMotion dur="4.6s" begin="0.4s" repeatCount="indefinite"
      path="M400,150 C 460,220 540,270 650,320" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="4.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#ffc07f" filter="url(#soft)">
    <animateMotion dur="4.1s" begin="1.6s" repeatCount="indefinite"
      path="M400,150 C 440,230 500,270 560,330" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="4.1s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- straight-up hero particles -->
  <circle r="6" fill="#ffffff" opacity="0.8" filter="url(#soft)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M400,150 C 400,60 400,-20 400,-100"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.7;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
